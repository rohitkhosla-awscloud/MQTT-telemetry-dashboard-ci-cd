name: Deploy MQTT Dashboard to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Fetch Latest Code
        run: |
          cd /home/ubuntu/apps/mqtt-dashboard
          git fetch origin main
          git reset --hard origin/main

      - name: Install Node Dependencies
        run: |
          cd /home/ubuntu/apps/mqtt-dashboard
          npm install --omit=dev

      - name: Restart PM2 Dashboard Process
        run: |
          pm2 restart mqtt-dashboard || pm2 start /home/ubuntu/apps/mqtt-dashboard/app.js --name "mqtt-dashboard"
          pm2 save